# assets/packs/propose_channels_fixture.yaml — a small, clinically generic
# pack exercising §4.2's six evidence channels (tests/propose_channels.nf.test).
#
# Pairs with the EXISTING test_data/fixtures/tables/profiling_fixture.csv
# (built by tests/fixtures/make_fixtures.py's profiling_fixture_table(), one
# of §2.1/§2.2/§2.3's own fixtures): its OS_MONTHS column (0.0..60.0) already
# resolves to a month candidate at header confidence and a day candidate at
# low, range-derived confidence (§2.2's day/month ambiguity band). The
# pack's own `time_to_event` (assets/packs/minimal.yaml) is outcome-flagged
# and so can never receive a candidate (§0 the invariant) -- os_days below
# is the NON-outcome day-unit variable §4.2's done-when needs to score
# OS_MONTHS against.
#
# os_days' domain_values is a PARTIAL overlap with OS_MONTHS's 20 observed
# values, deliberately (fix round 1, I3): 12 of the 20 values OS_MONTHS
# actually carries, plus 8 values it never carries (all >60, well outside
# OS_MONTHS's 0.0..60.0 range, so no accidental overlap). Still 20 entries
# total, so cardinality's domain_values branch (expected_cardinality == 20,
# matching n_unique == 20) stays ~1.0, unaffected -- but value_overlap's
# Jaccard is now 12 / (20 + 20 - 12) = 12/28 ~= 0.4286, genuinely lower.
# A verbatim-copied domain_values list pinned BOTH channels at exactly 1.0
# by construction, which is the card's own Trap made real ("if two channels
# move together under every perturbation, you have five") -- this shape
# lets them diverge instead, which tests/propose_channels.nf.test now
# asserts directly. Every value is a plain number; no disease term, gene
# symbol or cohort name anywhere in this file (§10.3).
pack: propose-channels-fixture-generic
version: 0.1.0
vocabulary: test-vocab-2026
variables:
  - name: os_days
    domain: observation
    concept_id: 500
    type: continuous
    unit: d
    domain_values:
      # the 12 values OS_MONTHS actually carries (of its 20)
      - "0.0"
      - "3.2"
      - "6.3"
      - "9.5"
      - "12.6"
      - "15.8"
      - "18.9"
      - "22.1"
      - "25.3"
      - "28.4"
      - "31.6"
      - "34.7"
      # 8 values OS_MONTHS never carries (all outside its 0.0..60.0 range)
      - "100.0"
      - "110.5"
      - "120.3"
      - "130.7"
      - "140.2"
      - "150.9"
      - "160.4"
      - "170.6"
  - name: study_endpoint
    domain: derived
    derivation: survival_time
    unit: day
    outcome: true # excluded from EVERY channel (§0 the invariant)
