repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-clinicalharmonize_logo_light.png
    - docs/images/nf-core-clinicalharmonize_logo_light.png
    - docs/images/nf-core-clinicalharmonize_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-clinicalharmonize_logo_light.png
    - docs/images/nf-core-clinicalharmonize_logo_light.png
    - docs/images/nf-core-clinicalharmonize_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: clinarmonize
  name: clinicalharmonize
  description: Multi-cohort clinical data harmonization to an OMOP CDM subset
  author: clinarmonize
  version: 0.1.0dev
  force: true
  outdir: nf-core-test
  is_nfcore: false
