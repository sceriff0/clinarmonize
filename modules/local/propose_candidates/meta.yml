---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: propose_candidates
description: Generate candidate column-to-variable mappings from profiles, deterministically bounded (section
  4.1)
keywords:
  - mapping
  - candidates
  - omop
tools:
  - python:
      description: Interpreter running this module's script from bin/.
      homepage: https://www.python.org
      documentation: https://docs.python.org/3/
      licence:
        - PSF-2.0
      identifier: ""
  - duckdb:
      description: In-process analytical database. Used for Parquet I/O and to pin quantile interpolation
        to a single engine so ledger hashes stay stable.
      homepage: https://duckdb.org
      documentation: https://duckdb.org/docs/
      licence:
        - MIT
      identifier: ""
input:
  - - replicate:
        type: string
        description: Replicate identifier, e.g. 'observed' or a permutation seed
    - profile_jsons:
        type: file
        description: Per-column profiles for this replicate
        pattern: "*.json"
        ontologies: []
  - - pack_variables_json:
        type: string
        description: JSON-encoded target variable definitions from the pack
  - - vocabulary_release:
        type: string
        description: Vocabulary release identifier, recorded for provenance
  - - generator_params_json:
        type: string
        description: JSON-encoded candidate-generator parameters
output:
  candidates:
    - - replicate:
          type: string
          description: Replicate identifier, e.g. 'observed' or a permutation seed
      - "*.parquet":
          type: file
          description: One row per (column, variable) candidate
          pattern: "*.parquet"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
          ontologies: []
authors:
  - "@bolt3x"
maintainers:
  - "@bolt3x"
